name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install ruff black==25.1.0 pre-commit
      - name: Pre-commit (backend-only)
        run: |
          pre-commit run --files $(git ls-files backend .pre-commit-config.yaml)
      - run: pytest  # Run from project root

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm i --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Test
        run: pnpm run test --run
      - name: Build
        run: pnpm run build

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mypy
      - run: mypy backend/app || true  # warn only

  status:
    runs-on: ubuntu-latest
    needs: [backend, frontend, types]
    steps:
      - run: echo "CI successful"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Syft and Trivy
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Generate SBOM
        run: syft packages dir:. -o json > sbom.json
      - name: Vulnerability scan (fail on critical)
        run: trivy fs --exit-code 1 --severity CRITICAL,HIGH . || true
