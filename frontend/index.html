    <!-- Google Analytics -->
    <script>
      // Only load Google Analytics in production
      // This will be replaced by Vite during build with actual boolean value
      const isProduction = import.meta.env.PROD;

            if (isProduction) {
        // Get GA tracking ID from environment
        const gaTrackingId = import.meta.env.VITE_GA_TRACKING_ID;

        // Only load if tracking ID is provided
        if (gaTrackingId) {
          // Load Google Analytics script
          const script = document.createElement('script');
          script.async = true;
          script.src = `https://www.googletagmanager.com/gtag/js?id=${gaTrackingId}`;
          document.head.appendChild(script);

          // Initialize Google Analytics
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', gaTrackingId);

          // Make gtag globally available for React app
          window._gaTrackingId = gaTrackingId;
        } else {
          console.warn('Google Analytics: No tracking ID configured (VITE_GA_TRACKING_ID)');
        }
      }
    </script>
