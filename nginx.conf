# Nginx configuration for HTTPS termination
#
# SSL/TLS Configuration Notes:
# - HTTP/2 enabled for improved performance with TLS 1.2
# - TLS 1.2 and 1.3 enabled (see ssl_protocols below)
# - Using Mozilla "Intermediate" cipher profile for security vs compatibility balance
# - TODO: Verify OpenSSL version supports TLS 1.3 in target AMI and adjust as needed



events {
    worker_connections 1024;
}

http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP header - generated from frontend/src/utils/csp.ts
    # Run 'npm run generate-csp' to update this header automatically
    # BEGIN_CSP_HEADER
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' 'wasm-unsafe-eval' data: blob: https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' data: https://fonts.googleapis.com https:; font-src 'self' data: https://fonts.gstatic.com https:; img-src 'self' data: https: blob: https://www.google-analytics.com https://stats.g.doubleclick.net; media-src 'self' data: blob:; connect-src 'self' http://localhost:* https://thesignalcallers.com ws://localhost:* wss://localhost:* https://www.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; worker-src 'self' blob: data:; child-src 'self' blob:" always;
    # END_CSP_HEADER

    # Rate limiting - Granular zones based on endpoint complexity
    limit_req_zone $binary_remote_addr zone=analytics:10m rate=2r/s;      # Heavy computations
    limit_req_zone $binary_remote_addr zone=combinations:10m rate=3r/s;   # Complex queries
    limit_req_zone $binary_remote_addr zone=search:10m rate=5r/s;         # User-driven
    limit_req_zone $binary_remote_addr zone=metadata:10m rate=5r/s;       # Lightweight
    limit_req_zone $binary_remote_addr zone=general:10m rate=3r/s;        # Health/static

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name thesignalcallers.com www.thesignalcallers.com;

        # Redirect all HTTP traffic to HTTPS
        return 301 https://$server_name$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name thesignalcallers.com www.thesignalcallers.com;

        # SSL configuration
        ssl_certificate /etc/letsencrypt/live/thesignalcallers.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/thesignalcallers.com/privkey.pem;

        # SSL security settings
        # Using Mozilla "intermediate" profile (2024-04) which is compatible with
        # OpenSSL 1.0.2k (FIPS) on Amazon Linux 2 _and_ modern TLS stacks.
        # TODO: when the EC2 AMI is upgraded (OpenSSL ≥1.1.1/3.x) remove this note
        #       and consider switching to the "modern" profile to regain TLS 1.3-only.
        ssl_protocols TLSv1.2 TLSv1.3;
        # Using double quotes (or no quotes) avoids literal single-quote parsing issues on some nginx builds.
        ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # API endpoints with granular rate limiting
        location /api/analytics/ {
            limit_req zone=analytics burst=5 nodelay;
            proxy_pass http://app:8000;
            include proxy_headers.conf;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location /api/combinations/ {
            limit_req zone=combinations burst=8 nodelay;
            proxy_pass http://app:8000;
            include proxy_headers.conf;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location /api/players/search {
            limit_req zone=search burst=10 nodelay;
            proxy_pass http://app:8000;
            include proxy_headers.conf;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location /api/metadata/ {
            limit_req zone=metadata burst=8 nodelay;
            proxy_pass http://app:8000;
            include proxy_headers.conf;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Catch-all for other API endpoints - using general zone to avoid unintended throttling
        location /api/ {
            limit_req zone=general burst=10 nodelay;
            proxy_pass http://app:8000;
            include proxy_headers.conf;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Health check endpoint - no rate limiting for monitoring systems
        location /health {
            proxy_pass http://app:8000;
            include proxy_headers.conf;
        }

        # Static assets - higher rate limits for cached content but still protected
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            limit_req zone=general burst=20 nodelay;  # Higher burst for static assets
            proxy_pass http://app:8000;
            include proxy_headers.conf;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            # Cache static assets
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Static files and frontend - standard rate limiting for dynamic content
        location / {
            limit_req zone=general burst=5 nodelay;
            proxy_pass http://app:8000;
            include proxy_headers.conf;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }
}
