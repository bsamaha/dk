# Top-level pre-commit configuration
# Docs: https://pre-commit.com/

repos:
  # ===== GENERAL FILE CHECKS =====
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']  # Allow custom YAML tags
      - id: check-toml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$
      - id: check-added-large-files
        args: ['--maxkb=1000']  # Prevent files > 1MB
        exclude: ^frontend/public/brand/
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # ===== PYTHON BACKEND =====
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black", "--filter-files"]
        files: ^backend/

  # ===== CODE QUALITY CHECKS =====
  - repo: local
    hooks:
      - id: check-code-quality
        name: "Code Quality Check"
        entry: bash -c "./scripts/check-code-quality.sh"
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.2
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Python security and quality
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        files: ^backend/.*\.py$
        args: ['--skip', 'B101,B608', '--exclude', 'backend/tests']
        # Skip B101 (assert_used) and B608 (hardcoded_sql_expressions) warnings

  # ===== FRONTEND =====
  - repo: local
    hooks:
      - id: frontend-lint
        name: "ESLint (frontend)"
        entry: bash -c "cd frontend && pnpm run lint"
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

      - id: frontend-format
        name: "Prettier (frontend)"
        entry: bash -c "cd frontend && pnpm run format"
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|json|css|md)$
        pass_filenames: false

      - id: frontend-test
        name: "Frontend Tests"
        entry: bash -c "cd frontend && pnpm run test --run"
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

      - id: frontend-build
        name: "Frontend Build"
        entry: bash -c "cd frontend && pnpm run build"
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

  # ===== PACKAGE MANAGEMENT =====
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^frontend/package\.json$
        args: ["--write"]

  # ===== DOCUMENTATION =====
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.37.0
    hooks:
      - id: markdownlint
        args: ["--fix"]
        files: ^(docs/.*\.md|README\.md)$

  # ===== COMMIT MESSAGE =====
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: ["feat", "fix", "chore", "docs", "style", "refactor", "perf", "test", "build", "ci"] # Allowed commit types

  # ===== SECRETS DETECTION =====
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^(frontend/pnpm-lock\.yaml|frontend/package-lock\.json|.*\.lock)$

  # ===== ENSURE FRONTEND LOCKFILE SYNC =====
  - repo: local
    hooks:
      - id: check-frontend-lockfile-sync
        name: 'Check pnpm-lock.yaml is in sync with package.json (frontend)'
        entry: bash -c 'cd frontend && pnpm install --frozen-lockfile'
        language: system
        files: ^frontend/package\.json$
        pass_filenames: false

# ===== CONFIGURATION =====
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
