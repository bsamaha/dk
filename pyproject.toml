
[tool.poetry]
name = "dk-backend"
version = "0.1.0"
description = ""
authors = ["Blake <blake@dataknox.dev>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.1"}
duckdb = "^1.0.0"
polars = {extras = ["pyarrow"], version = "^0.20.31"}
pydantic-settings = "^2.3.4"
pyarrow = "^16.1.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0"
httpx = "^0.27.0"
pre-commit = "^3.7.1"
ruff = "^0.5.0"
isort = "^5.13.2"
bandit = "^1.7.9"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.bandit]
exclude_dirs = ["tests", "backend/tests"]
skips = ["B101", "B608"]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = [
    "backend/tests",
]
