events {
    worker_connections 1024;
}

http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Simple HTTP server for Let's Encrypt validation
    server {
        listen 80;
        server_name thesignalcallers.com www.thesignalcallers.com;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Simple response for other requests
        location / {
            return 200 "Bootstrap server running. Waiting for SSL certificates...";
            add_header Content-Type text/plain;
        }
    }
}
