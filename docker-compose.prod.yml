services:
  # Your FastAPI application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fantasy-analytics-app
    ports:
      # Only expose internally - Nginx will handle external traffic
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data:ro
    env_file:
      - env.production
    environment:
      - ENVIRONMENT=production
      - ALLOWED_HOSTS=thesignalcallers.com,www.thesignalcallers.com
    restart: unless-stopped
    networks:
      - app-network

  # Nginx reverse proxy with HTTPS
  nginx:
    image: nginx:alpine
    container_name: fantasy-analytics-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - nginx-logs:/var/log/nginx
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - app-network

  # Certbot for SSL certificate management
  certbot:
    image: certbot/certbot
    container_name: fantasy-analytics-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    env_file:
      - env.production
    entrypoint: ["/bin/sh", "-c"]
    # Use single $ so that /bin/sh expands the SSL_EMAIL variable correctly.
    command: ["certbot certonly --webroot --webroot-path=/var/www/certbot --email $SSL_EMAIL --agree-tos --no-eff-email -d thesignalcallers.com -d www.thesignalcallers.com"]
    depends_on:
      - nginx
    networks:
      - app-network

volumes:
  nginx-logs:

networks:
  app-network:
    driver: bridge
